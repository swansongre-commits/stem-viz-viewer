  <p class="f-note" style="margin-top:0">
    <b>르샤틀리에 원리</b>: 평형 상태에 있는 반응의 농도, 압력, 온도를 바꾸면 그 변화를 줄이는 방향으로 평형이 이동하여 새로운 평형에 이릅니다.
  </p>
  <div class="formula">
    <div class="f-row">
      <div class="f-name">평형 상수 (온도에 따라서만 달라짐)</div>
      <div class="f-expr"><i>K</i> = [NO₂]² / [N₂O₄]</div>
      <div class="f-sub">= <b data-f="K"></b> mol/L (<b data-f="T"></b> °C, 약)</div>
    </div>
    <div class="f-row">
      <div class="f-name">반응 지수 (지금 농도로 계산)</div>
      <div class="f-expr"><i>Q</i> = [NO₂]² / [N₂O₄]</div>
      <div class="f-sub">= (<b data-f="b"></b>)² / <b data-f="a"></b> = <b data-f="Q"></b></div>
      <p class="f-note" data-f="cmp"></p>
    </div>
    <div class="f-row">
      <div class="f-name">다시 이루어질 평형 (지금 부피·온도에서 계산)</div>
      <div class="f-sub">[N₂O₄] = <b data-f="ea"></b> M, [NO₂] = <b data-f="eb"></b> M</div>
    </div>
    <div class="f-row">
      <div class="f-name">최근 변화</div>
      <div class="f-expr" data-f="ev"></div>
      <div class="f-sub" data-f="evq"></div>
      <p class="f-note" data-f="evx"></p>
    </div>
    <div class="f-row">
      <div class="f-name">일상생활 속 평형 이동</div>
      <p class="f-note"><b>탄산음료 마개를 열면 거품</b>: 병 속에서는 CO₂(g) ⇌ CO₂(aq) 평형을 이룹니다. 마개를 열면 CO₂의 압력이 낮아져, 녹아 있던 CO₂가 기체로 빠져나오는 쪽으로 평형이 이동합니다.</p>
      <p class="f-note"><b>높은 산에서 혈액의 산소 운반</b>: 헤모글로빈(Hb) + O₂ ⇌ HbO₂. 산소의 압력이 낮은 높은 산에서는 역반응 쪽으로 이동해 산소 운반량이 줄어듭니다. 오래 머물면 몸이 헤모글로빈을 더 만들어 정반응 쪽으로 되돌립니다.</p>
      <p class="f-note"><b>암모니아 합성 (하버 공정)</b>: N₂(g) + 3H₂(g) ⇌ 2NH₃(g), 정반응 발열. 기체 분자 수가 줄어드는 쪽으로 이동하도록 압력을 높이고(약 200기압), 온도는 너무 낮으면 반응이 느리므로 약 450 °C에서 촉매를 쓰며, 생긴 NH₃를 액화해 빼내어 정반응 쪽으로 이동시킵니다.</p>
