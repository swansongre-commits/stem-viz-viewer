  <div class="formula" style="margin-top:0;border-top:0">
    <div class="f-row" data-scene="magnet">
      <div class="f-name">패러데이 전자기 유도 법칙</div>
      <div class="f-expr"><i>ε</i> = −<i>N</i> Δ<i>Φ</i> / Δ<i>t</i></div>
      <div class="f-sub">= −<b data-f="N"></b> × (<b data-f="dphi"></b> mWb/s) = <b data-f="emf"></b> mV</div>
      <p class="f-note">ΔΦ/Δt는 코일 한 바퀴를 지나는 자속이 1초에 변하는 양입니다. 자속이 커도 변하지 않으면 기전력은 0입니다.</p>
    </div>
    <div class="f-row" data-scene="magnet">
      <div class="f-name">렌츠 법칙</div>
      <p class="f-note" style="color:inherit">유도 전류는 코일을 지나는 자속의 변화를 방해하는 방향으로 흐릅니다. 자석이 다가오면 밀어내는 극이, 멀어지면 끌어당기는 극이 코일에 생깁니다.</p>
      <p class="f-note" data-f="lenz"></p>
    </div>
    <div class="f-row" data-scene="magnet">
      <div class="f-name">모형</div>
      <p class="f-note">자석을 점 자기 쌍극자로 보고, 고리 한 바퀴의 자속을 Φ = μ₀ma² / 2(a² + z²)<sup>3/2</sup>로 계산했습니다 (코일 반지름 a = 2 cm).</p>
    </div>

    <div class="f-row" data-scene="wireless">
      <div class="f-name">상호 유도</div>
      <div class="f-expr"><i>ε</i><sub>2</sub> = −<i>N</i><sub>2</sub> Δ<i>Φ</i><sub>2</sub> / Δ<i>t</i></div>
      <div class="f-sub">최댓값 = <i>N</i><sub>2</sub> × 2π<i>f</i> × <i>Φ</i><sub>2</sub> = 10 × 2π × ${ri/1e3} kHz × <b data-f="phi2"></b> μWb = <b data-f="e2"></b> V</div>
      <p class="f-note">1차 코일(10회, 1 A)의 교류가 만드는 자기장이 계속 변하므로, 2차 코일(10회)을 지나는 자속도 변해 기전력이 유도됩니다. 두 코일이 멀어지거나 어긋나면 2차 코일을 지나는 자속이 빠르게 줄어듭니다.</p>
    </div>
    <div class="f-row" data-scene="wireless">
      <div class="f-name">모형</div>
      <p class="f-note">반지름 ${ti*100} cm인 두 원형 코일의 상호 유도를 계산했습니다. 공진 회로와 2차 코일 전류의 영향은 무시했고, 전구 밝기는 가장 가까이 정렬했을 때를 100%로 한 상댓값입니다.</p>
    </div>

    <div class="f-row">
      <div class="f-name">전자기 유도의 활용</div>
      <dl class="kv" style="grid-template-columns:auto 1fr;margin-top:0.35rem">
        <dt>센서</dt><dd style="font-weight:400;text-align:left">금속 탐지기, 차량 속도·바퀴 회전 센서, 전기 기타 픽업</dd>
        <dt>무선통신</dt><dd style="font-weight:400;text-align:left">안테나와 근거리 무선 통신(NFC)은 변하는 자기장으로 신호를 주고받습니다</dd>
        <dt>무선 충전</dt><dd style="font-weight:400;text-align:left">충전 패드의 교류가 스마트폰 코일에 기전력을 유도합니다</dd>
        <dt>교통카드</dt><dd style="font-weight:400;text-align:left">단말기의 변하는 자기장이 카드 속 코일에 기전력을 유도해 전지 없이 칩이 작동합니다</dd>
      </dl>

  <div class="formula" style="margin-top:0;border-top:0">
    <div class="f-row">
      <div class="f-name">보강 간섭 (밝은 무늬)</div>
      <div class="f-expr">|S₂P − S₁P| = <i>m</i>λ &nbsp;(<i>m</i> = 0, 1, 2, …)</div>
    </div>
    <div class="f-row">
      <div class="f-name">상쇄 간섭 (어두운 무늬)</div>
      <div class="f-expr">|S₂P − S₁P| = (<i>m</i> + ½)λ</div>
    </div>
    <div class="f-row">
      <div class="f-name">지금 점 P</div>
      <div class="f-sub">경로차 = <b data-f="pdl"></b>λ = <b data-f="pdnm"></b> nm</div>
      <div class="f-sub">→ <b data-f="pkind"></b></div>
    </div>
    <div class="f-row">
      <div class="f-name">이웃한 밝은 무늬 사이 간격</div>
      <div class="f-expr">Δ<i>x</i> = <i>L</i>λ / <i>d</i></div>
      <div class="f-sub">= <b data-f="L"></b> m × (<b data-f="lam"></b> × 10⁻⁹ m) ÷ (<b data-f="d"></b> × 10⁻³ m) = <b data-f="dxf"></b> mm</div>
      <div class="f-sub">스크린에서 잰 값: <b data-f="dxm"></b> mm</div>
      <p class="f-note">이웃한 밝은 무늬로 옮겨 가면 경로차가 λ만큼 늘어나므로 <i>d</i> × Δ<i>x</i> / <i>L</i> = λ입니다. 슬릿 간격이 스크린 거리보다 훨씬 작을 때(작은 각도) 성립하는 근사식이라, 모형에서 잰 값과 1~2% 차이가 날 수 있습니다.</p>
    </div>
    <div class="f-row">
      <div class="f-name">빛의 파동성</div>
      <p class="f-note">빛이 작은 알갱이처럼 곧게만 나아간다면 슬릿 뒤에 밝은 줄 두 개만 생겨야 합니다. 실제로는 밝고 어두운 무늬가 고르게 반복되므로, 빛이 회절하고 간섭하는 파동임을 알 수 있습니다.</p>
    </div>
    <div class="f-row">
      <div class="f-name">간섭을 이용한 기술과 현상</div>
      <p class="f-note"><b>비눗방울·기름막의 색</b>: 얇은 막의 윗면과 아랫면에서 반사한 빛이 간섭합니다. 막의 두께에 따라 보강되는 파장이 달라 여러 색이 보입니다.</p>
      <p class="f-note"><b>무반사 코팅</b>: 안경·카메라 렌즈에 얇은 막을 입혀 두 면에서 반사한 빛이 상쇄 간섭하게 하면 반사가 줄고 더 많은 빛이 렌즈를 통과합니다.</p>
      <p class="f-note"><b>홀로그램</b>: 물체에서 온 빛과 기준 빛이 만든 간섭무늬를 기록해 두었다가, 빛을 다시 비추어 입체 영상을 재현합니다.</p>
    </div>

  <div class="formula" style="margin-top:0;border-top:0">
    <div class="f-row" data-scene="wire">
      <div class="f-name">자기장 속 도선이 받는 힘</div>
      <div class="f-expr"><i>F</i> = <i>BIL</i></div>
      <div class="f-sub">= <b data-f="wB"></b> T × <b data-f="wI"></b> A × <b data-f="wL"></b> m = <b data-f="wF"></b> N</div>
      <p class="f-note">자기장과 전류가 수직일 때의 크기입니다. 힘은 자기장과 전류 모두에 수직인 방향으로 작용합니다.</p>
    </div>
    <div class="f-row" data-scene="wire">
      <div class="f-name">기울어지는 각</div>
      <div class="f-expr">tan<i>θ</i> = <i>F</i> / <i>mg</i></div>
      <div class="f-sub">= <b data-f="wF"></b> N ÷ <b data-f="wMg"></b> N, <i>θ</i> = <b data-f="wTh"></b>°</div>
    </div>
    <div class="f-row" data-scene="wire">
      <div class="f-name">방향 찾기</div>
      <p class="f-note">오른손을 펴서 엄지를 전류 방향, 나머지 네 손가락을 자기장 방향으로 향하게 하면 손바닥이 향하는 쪽이 힘의 방향입니다(플레밍 왼손 법칙으로 찾아도 같습니다). 전류 주위에는 동심원 모양 자기장이 생기고(오른손 법칙), 두 자기장이 더해져 센 쪽에서 약한 쪽으로 도선이 밀립니다.</p>
    </div>

    <div class="f-row" data-scene="motor">
      <div class="f-name">코일 한 변이 받는 힘</div>
      <div class="f-expr"><i>F</i> = <i>NBIL</i></div>
      <div class="f-sub">= <b data-f="mN"></b> × ${za} T × <b data-f="mI"></b> A × ${Ba} m = <b data-f="mF"></b> N</div>
      <p class="f-note">자기장과 전류가 늘 수직이라, 코일이 돌아도 힘의 크기는 변하지 않습니다.</p>
    </div>
    <div class="f-row" data-scene="motor">
      <div class="f-name">돌림힘</div>
      <div class="f-expr"><i>τ</i> = 2 × <i>F</i> × <i>d</i>, <i>d</i> = <i>R</i>|cos<i>θ</i>|</div>
      <div class="f-sub">= 2 × <b data-f="mF"></b> N × <b data-f="mD"></b> m = <b data-f="mTau"></b> N·m</div>
      <p class="f-note">R = ${Va*100} cm는 회전축에서 코일 변까지 거리, θ는 코일 면이 자기장과 이루는 각입니다. 코일 면이 자기장에 수직이면 d = 0이라 돌림힘이 0입니다.</p>
    </div>
    <div class="f-row" data-scene="motor">
      <div class="f-name">정류자의 역할</div>
      <p class="f-note">코일이 반 바퀴 돌 때마다(코일 면이 자기장에 수직일 때) 정류자가 코일에 흐르는 전류의 방향을 바꿔, 돌림힘이 늘 같은 회전 방향이 되게 합니다. 회전 속도는 마찰(부하)이 속력에 비례한다고 가정한 모형입니다.</p>
    </div>

    <div class="f-row" data-scene="speaker">
      <div class="f-name">보이스 코일이 받는 힘</div>
      <div class="f-expr"><i>F</i> = <i>BIL</i>, <i>L</i> = <i>N</i> × 2π<i>r</i></div>
      <div class="f-sub"><i>L</i> = 50 × 2π × ${Ga} m = ${Ka.toFixed(2)} m</div>
      <div class="f-sub">= ${1 .toFixed(1)} T × <b data-f="sI"></b> A × ${Ka.toFixed(2)} m = <b data-f="sF"></b> N</div>
      <p class="f-note">교류의 방향이 바뀔 때마다 힘의 방향이 바뀌어 진동판이 앞뒤로 진동하고, 같은 진동수의 소리가 납니다. 진동판은 용수철에 매달린 물체로 본 단순 모형입니다.</p>
    </div>
    <div class="f-row" data-scene="speaker">
      <div class="f-name">소리의 파장</div>
      <div class="f-expr"><i>λ</i> = <i>v</i> / <i>f</i></div>
      <div class="f-sub">= 340 m/s ÷ <b data-f="sf"></b> Hz = <b data-f="sLam"></b> m</div>
    </div>

    <div class="f-row">
      <div class="f-name">에너지 전환</div>
      <div class="f-expr">전기 에너지 → 역학적 에너지<span data-f="snd"> → 소리 에너지</span></div>
      <p class="f-note" data-f="chain"></p>

  <div class="formula" style="margin-top:0;border-top:0">
    <div class="f-row">
      <div class="f-name">로런츠 인자</div>
      <div class="f-expr"><i>γ</i> = 1 / √(1 − <i>v</i>²/<i>c</i>²)</div>
      <div class="f-sub"><i>v</i> = <b data-f="beta"></b><i>c</i> 일 때 <i>γ</i> = <b data-f="gamma"></b></div>
    </div>
    <div data-view="clock">
      <div class="f-row">
        <div class="f-name">시간 팽창</div>
        <div class="f-expr">Δ<i>t</i> = <i>γ</i>Δ<i>t</i><sub>0</sub></div>
        <div class="f-sub">Δ<i>t</i><sub>0</sub> = 2<i>L</i>/<i>c</i> = 2 × ${vo} m / (3.0 × 10⁸ m/s) = <b>${(So()*1e9).toFixed(0)}</b> ns</div>
        <div class="f-sub">Δ<i>t</i> = <b data-f="gamma"></b> × ${(So()*1e9).toFixed(0)} ns = <b data-f="tick"></b> ns</div>
        <p class="f-note">지구에서 보면 빛은 대각선을 따라 가므로 (<i>c</i>Δ<i>t</i>/2)² = <i>L</i>² + (<i>v</i>Δt/2)²입니다. 빛의 속력은 <i>c</i>로 같으므로 더 먼 길을 가는 만큼 한 번 째깍하는 시간이 길어집니다.</p>
      </div>
      <div class="f-row">
        <div class="f-name">길이 수축</div>
        <div class="f-expr"><i>L</i> = <i>L</i><sub>0</sub> / <i>γ</i></div>
        <div class="f-sub"><i>L</i><sub>0</sub> = 100 m → <i>L</i> = <b data-f="len"></b> m</div>
        <p class="f-note">운동 방향의 길이만 줄어들고, 운동 방향에 수직인 높이는 그대로입니다.</p>
      </div>
    </div>
    <div data-view="muon" hidden>
      <div class="f-row">
        <div class="f-name">지구에서 본 뮤온의 평균 수명</div>
        <div class="f-expr"><i>γτ</i><sub>0</sub> (<i>τ</i><sub>0</sub> = 2.2 μs)</div>
        <div class="f-sub">= <b data-f="gamma"></b> × 2.2 μs = <b data-f="life"></b> μs</div>
      </div>
      <div class="f-row">
        <div class="f-name">평균 이동 거리</div>
        <div class="f-sub">시간 팽창이 없다면 <i>vτ</i><sub>0</sub> = <b data-f="dc"></b> km</div>
        <div class="f-sub">시간 팽창을 생각하면 <i>γvτ</i><sub>0</sub> = <b data-f="dr"></b> km</div>
        <p class="f-note">대기 두께 약 10 km와 비교해 보세요.</p>
      </div>
      <div class="f-row">
        <div class="f-name">뮤온이 볼 때 (길이 수축)</div>
        <div class="f-sub">대기 두께 10 km / <i>γ</i> = <b data-f="atm"></b> km</div>
        <p class="f-note">뮤온의 수명은 2.2 μs 그대로지만, 뮤온이 보면 대기층이 얇아져 지면까지 갈 수 있습니다. 두 관찰자의 설명은 같은 결과를 줍니다.</p>
      </div>
    </div>
    <div class="f-row">
      <div class="f-name">사회에 미친 영향: GPS 위성 시간 보정</div>
      <p class="f-note">GPS 위성(속력 약 3.9 km/s)의 시계는 특수 상대성 이론의 시간 팽창으로 지상보다 하루에 약 7 μs 느려집니다. 한편 높은 곳은 중력이 약해 일반 상대성 이론에 따라 하루에 약 45 μs 빨라지므로, 합하면 하루에 약 38 μs 빨라집니다. 이를 보정하지 않으면 위치 오차가 하루에 10 km 넘게 쌓입니다.</p>
    </div>

  <div class="formula" style="margin-top:0;border-top:0">
    <div class="f-row">
      <div class="f-name">드브로이 파장</div>
      <div class="f-expr">λ = <i>h</i> / <i>p</i> = <i>h</i> / (<i>mv</i>)</div>
      <div class="f-sub"><i>eV</i> = ½<i>mv</i>² → <i>v</i> = <b data-f="v"></b> × 10⁶ m/s</div>
      <div class="f-sub"><i>p</i> = <i>mv</i> = <b data-f="p"></b> × 10⁻²⁴ kg·m/s</div>
      <div class="f-sub">λ = 6.63 × 10⁻³⁴ ÷ (<b data-f="p"></b> × 10⁻²⁴) = <b data-f="lam"></b> pm</div>
      <p class="f-note">1 pm(피코미터) = 10⁻¹² m. 전압을 높이면 전자가 빨라져 운동량이 커지고 파장은 짧아집니다.</p>
    </div>
    <div class="f-row">
      <div class="f-name">무늬 간격</div>
      <div class="f-expr">Δ<i>x</i> = <i>L</i>λ / <i>d</i></div>
      <div class="f-sub">= 1.0 m × <b data-f="lam"></b> pm ÷ <b data-f="d"></b> nm = <b data-f="dx"></b> mm</div>
      <p class="f-note">빛의 이중 슬릿과 같은 식입니다. 전자도 파동처럼 두 슬릿을 함께 지나 간섭합니다.</p>
    </div>
    <div class="f-row">
      <div class="f-name">파장 비교</div>
      <dl class="kv">
        <dt>전자 (<span data-f="V"></span> V로 가속)</dt><dd><span data-f="lam"></span> pm</dd>
        <dt>가시광선</dt><dd>약 400~700 nm</dd>
        <dt>야구공 (0.145 kg, 40 m/s)</dt><dd data-f="ball"></dd>
      </dl>
      <p class="f-note">야구공의 파장은 원자핵 크기(약 10⁻¹⁵ m)보다도 10¹⁹배쯤 짧아서, 간섭이나 회절을 관찰할 수 있는 틈이 없습니다. 그래서 일상의 물체에서는 파동성이 드러나지 않습니다.</p>
    </div>
    <div class="f-row">
      <div class="f-name">전자 현미경</div>
      <p class="f-note">현미경으로 구별할 수 있는 가장 작은 크기(분해능)는 쓰는 파동의 파장 정도입니다. 가시광선 현미경은 약 200 nm가 한계지만, 전자의 파장은 이보다 수천 배 이상 짧아 바이러스나 원자 배열처럼 작은 구조까지 볼 수 있습니다. 가속 전압을 높일수록 파장이 짧아져 분해능이 좋아집니다.</p>
    </div>
    <div class="f-row">
      <div class="f-name">빛의 입자성</div>
      <p class="f-note">빛도 간섭하는 파동이지만, 금속에 비추면 진동수가 일정한 값 이상일 때만 전자가 튀어나옵니다(광전 효과). 빛의 에너지가 <i>hf</i>인 알갱이(광자) 단위로 전달되기 때문입니다. 디지털카메라의 이미지 센서는 화소마다 들어온 광자가 만든 전자를 모아 영상 정보를 전기 신호로 바꾸어 저장합니다.</p>
